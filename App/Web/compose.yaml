name: linkguard
x-api: &api
  build: ./api
  environment: &api-env
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DATABASE_URL: postgresql+psycopg://linkguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/linkguard
    REDIS_URL: redis://redis:6379/0
    PRIVATE_STORAGE: /private
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    GOOGLE_MOBILE_CLIENT_IDS: ${GOOGLE_MOBILE_CLIENT_IDS:-}
    MOBILE_TOKEN_TTL: ${MOBILE_TOKEN_TTL:-2592000}
    MOBILE_CORS_ORIGINS: ${MOBILE_CORS_ORIGINS:-}
  volumes:
    - private_files:/private
    - ./api/instance/models:/app/instance/models:ro
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkguard
      POSTGRES_USER: linkguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U linkguard -d linkguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    command: [flask, --app, app:create_app, db, upgrade]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/api/v1/health")',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *api
    command: [python, worker.py]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build:
      context: ./admin
      args:
        API_URL: http://api:5000
        MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    environment:
      API_URL: http://api:5000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          'const r = await fetch("http://127.0.0.1:3000/login"); process.exit(r.ok ? 0 : 1)',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  test:
    <<: *api
    profiles: [test]
    user: root
    environment:
      <<: *api-env
      TEST_DATABASE_URL: postgresql+psycopg://linkguard:${POSTGRES_PASSWORD}@postgres:5432/linkguard_test
      TEST_REDIS_URL: redis://redis:6379/15
    command: [python, -m, pytest, -q]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  private_files:
