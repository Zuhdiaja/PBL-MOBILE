server {
    listen 3000;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        set $backend http://api:5000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-LinkGuard-Client-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Flask enforces the configured CSV and multipart limits.
        client_max_body_size 0;
    }

    location / {
        set $frontend http://admin:3000;
        proxy_pass $frontend;
        proxy_set_header Host $http_host;
    }
}
